[project]
name = "nvit"
version = "0.1.0"
description = ""
authors = [{ name = "slobodaapl", email = "slobodaapl@gmail.com" }]
requires-python = ">=3.8,<=3.11.9"
readme = "README.md"
dependencies = [
    "ninja==1.*",
    "packaging==24.*",
    "kornia==0.*",
#    "flash-attn==2.*",
    "torch==2.*",
    "torchvision==0.*",
    "matplotlib==3.*",
    "tqdm==4.*",
    "psutil==6.*",
    "einops==0.*",
    "loguru==0.*",
    "pydantic==2.*",
    "dynaconf==3.*",
    "wandb>=0.13.0,<1.0",
]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.sources]
torch = { index = "pytorch-gpu" }
torchvision = { index = "pytorch-gpu" }

[build-system]
requires = ["hatchling", "packaging", "ninja"]
build-backend = "hatchling.build"
